{% comment %}Progress bar for the order flow. Pass `current` = 1..6.{% endcomment %}
<ol class="order-steps" aria-label="Order progress">
  <li class="{% if current > 1 %}done{% elif current == 1 %}current{% endif %}">Coffee</li>
  <li class="{% if current > 2 %}done{% elif current == 2 %}current{% endif %}">Type</li>
  <li class="{% if current > 3 %}done{% elif current == 3 %}current{% endif %}">Milk &amp; size</li>
  <li class="{% if current > 4 %}done{% elif current == 4 %}current{% endif %}">Price</li>
  <li class="{% if current > 5 %}done{% elif current == 5 %}current{% endif %}">Pay</li>
  <li class="{% if current == 6 %}current{% endif %}">Pick up</li>
</ol>
