<svg class="milk-carton {{ css_class }}" viewBox="0 0 90 170" role="img" aria-label="{{ name }} carton">
  <defs>
    <linearGradient id="{{ uid }}-front" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeae4"/>
    </linearGradient>
  </defs>

  <!-- Gable top -->
  <rect x="30" y="4" width="26" height="10" rx="1.5" fill="#e4ded6" stroke="#cfc6bb"/>
  <path d="M12 44 L30 14 H56 L74 44 Z" fill="#f6f3ef" stroke="#cfc6bb" stroke-width="1.2"/>
  <path d="M74 44 L56 14 L82 34 V48 Z" fill="#ddd6cd" stroke="#cfc6bb" stroke-width="1.2"/>
  <circle cx="45" cy="30" r="5" fill="{{ color }}"/>

  <!-- Body: front and side -->
  <rect x="12" y="44" width="62" height="120" rx="2" fill="url(#{{ uid }}-front)" stroke="#cfc6bb" stroke-width="1.2"/>
  <path d="M74 44 L82 48 V160 L74 164 Z" fill="#d9d1c7" stroke="#cfc6bb" stroke-width="1.2"/>

  <!-- Brand -->
  <text x="43" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="5.2" fill="#8a6a55"
        textLength="40" lengthAdjust="spacingAndGlyphs">MORNING CAFE</text>

  <!-- Coloured band with the milk name -->
  <rect x="12" y="66" width="62" height="44" fill="{{ color }}"/>
  <path d="M12 104 Q30 96 43 104 T74 104 V110 H12 Z" fill="{{ dark }}" opacity=".35"/>
  <text x="43" y="91" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700"
        fill="#ffffff" textLength="{{ label_length }}" lengthAdjust="spacingAndGlyphs">{{ label }}</text>
  <text x="43" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing="2.5"
        fill="{{ dark }}">MILK</text>

  <!-- Leaf for plant milks, drop for dairy -->
  {% if plant_based %}
    <path d="M43 152 C30 150 30 136 43 132 C56 136 56 150 43 152 Z" fill="#5b8c3a"/>
    <path d="M43 152 V136" stroke="#3e6a24" stroke-width="1.2"/>
  {% else %}
    <path d="M43 132 C49 140 52 144 52 147 A9 9 0 0 1 34 147 C34 144 37 140 43 132 Z" fill="#7fb3e0"/>
  {% endif %}
</svg>
