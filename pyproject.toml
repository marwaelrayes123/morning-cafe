[project]
name = "morning-cafe"
version = "0.1.0"
description = "Build your own coffee and buy it (fake payments) — Django practice project"
requires-python = ">=3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: Playwright browser tests (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]
